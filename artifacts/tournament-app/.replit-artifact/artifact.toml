kind = "web"
previewPath = "/"
title = "Indoor Games Tournament"
version = "1.0.0"
id = "artifacts/tournament-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22521

[services.development]
run = "pnpm --filter @workspace/tournament-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tournament-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/tournament-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22521"
BASE_PATH = "/"
